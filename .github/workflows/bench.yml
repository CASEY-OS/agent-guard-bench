name: bench
on: [push, workflow_dispatch]
jobs:
  bench:
    # macOS: the undo checks need a write jail, and sandbox-exec ships with macOS.
    # The first public run, on ubuntu-latest, had no jail (no bwrap) and failed those checks.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The checker first proves it catches a planted wrong number and passes a clean one.
      - name: The surface checker's self-test
        run: python3 tools/check_surfaces.py --self-test
      - name: Run the benchmark
        run: python3 bench.py
      # The exit code is not the verdict: read the OVERALL line, then check every mapped number on the surfaces.
      - name: The verdict line
        run: |
          grep -q '^\*\*OVERALL: PASS\*\*' results/SUMMARY.md
      - name: Every mapped number on the surfaces
        run: python3 tools/check_surfaces.py results/NUMBERS.json tools/SURFACE_MAP.json
